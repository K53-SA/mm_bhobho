<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PSR Lesson 1 – NB Text Answer Test</title>
<style>
  body{
    font-family:system-ui,Segoe UI,Roboto,Arial;
    margin:0;
    padding:0;
    background:#020617;
    color:#f9fafb;
  }
  .app{max-width:1000px;margin:0 auto;padding:24px 16px 40px;}
  .card{
    background:#0b1120;
    border-radius:12px;
    padding:20px 18px;
    box-shadow:0 18px 45px rgba(0,0,0,0.8);
    border:1px solid #1f2937;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:10px;
  }
  h1{margin:0;font-size:22px;color:#e5e7eb}
  .subtitle{font-size:13px;color:#9ca3af;margin-top:4px}
  .top-right{
    text-align:right;
    font-size:13px;
    color:#d1d5db;
  }
  .timer{font-weight:600;color:#38bdf8;font-size:15px}
  .score{margin-top:4px}
  .btn{
    display:inline-block;
    padding:9px 13px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    font-size:14px;
    font-weight:500;
    margin-right:8px;
    margin-bottom:8px;
  }
  .btn-primary{background:#2563eb;color:#f9fafb}
  .btn-secondary{background:#111827;color:#e5e7eb;border:1px solid #374151}
  .btn:disabled{opacity:0.45;cursor:default}
  .question-block{
    margin-top:6px;
    padding-top:10px;
    border-top:1px solid #111827;
  }
  .q-text{font-weight:600;font-size:15px;color:#f9fafb;margin-bottom:8px}
  .input-row{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  input[type="text"]{
    width:100%;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid #374151;
    background:#020617;
    color:#e5e7eb;
    font-size:13px;
  }
  input[type="text"]:focus{
    outline:none;
    border-color:#38bdf8;
    box-shadow:0 0 0 1px #0ea5e9;
  }
  .hint-box{
    margin-top:6px;
    padding:8px 10px;
    border-radius:8px;
    background:#111827;
    border:1px dashed #38bdf8;
    font-size:13px;
    color:#e0f2fe;
  }
  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
  }
  .progress{
    font-size:13px;
    color:#9ca3af;
  }
  .feedback{
    margin-top:6px;
    font-size:13px;
  }
  .feedback.good{color:#6ee7b7}
  .feedback.bad{color:#fca5a5}
  .result{
    margin-top:16px;
    padding:10px;
    border-radius:10px;
    border:1px solid #38bdf8;
    background:#020617;
    font-size:14px;
  }
  .result.pass{border-color:#22c55e}
  .result.fail{border-color:#ef4444}
  .status-tag{
    display:inline-block;
    margin-left:6px;
    padding:2px 6px;
    border-radius:4px;
    font-size:12px;
    font-weight:600;
  }
  .status-pass{background:#14532d;color:#bbf7d0}
  .status-fail{background:#7f1d1d;color:#fecaca}
  .summary-item{
    font-size:13px;
    margin-top:4px;
    color:#d1d5db;
  }
  .confetti-piece{
    position:fixed;
    width:8px;
    height:14px;
    background:var(--c);
    top:-20px;
    left:50%;
    opacity:0.9;
    pointer-events:none;
    animation:fall 2.7s linear forwards;
    z-index:9999;
  }
  @keyframes fall{
    0%{transform:translate3d(0,0,0) rotateZ(0deg);}
    100%{transform:translate3d(var(--x),110vh,0) rotateZ(360deg);}
  }
</style>
</head>
<body>
<div class="app">
  <div class="card" id="app-card"></div>
</div>

<script>
// -------- NB QUESTIONS ONLY (1,2,3,4,5,7,8,10,11,13,14,16) --------
const questions = [
  {
    id: 1,
    prompt: "State the purpose of the Plant Safety Regulations.",
    solutions: [
      "To specify and provide requirements for the application of compulsory health and safety standards and procedures for the safeguard of plant and protection of all persons who work on plant and machinery under the control of Eskom Generation Division."
    ],
    keywords: [
      ["compulsory","health","safety","standards","procedures","safeguard","plant","protection","persons","machinery","eskom","generation"]
    ]
  },
  {
    id: 2,
    prompt: "List three dangers of movement.",
    solutions: [
      "It is possible to fall to a lower level.",
      "One can be struck by falling objects.",
      "One can come into contact with moving machinery."
    ],
    keywords: [
      ["fall","lower","level"],
      ["struck","falling","objects"],
      ["contact","moving","machinery"]
    ]
  },
  {
    id: 3,
    prompt: "List the responsibilities of every authorised person who is in possession of a copy of the regulations.",
    solutions: [
      "Will be held responsible for the knowledge of and compliance with the regulations contained therein.",
      "Must maintain his/her copy in the case of Alterations, Amendments, Exemptions, or Waivers.",
      "Must refer to the latest revision of these regulations as reflected on SharePoint."
    ],
    keywords: [
      ["responsible","knowledge","compliance"],
      ["maintain","copy","alterations","amendments","exemptions","waivers"],
      ["latest","revision","sharepoint"]
    ]
  },
  {
    id: 4,
    prompt: "How can explosions occur in confined spaces?",
    solutions: [
      "Pulverised fuel is suspended in the air in a certain proportion.",
      "A concentration of flammable gases or vapours is present, e.g. hydrogen, LP gas, acetylene, and petrol vapours.",
      "There is a source of ignition or spontaneous combustion."
    ],
    keywords: [
      ["pulverised","fuel","suspended","air"],
      ["concentration","flammable","gases","vapours"],
      ["source","ignition","spontaneous","combustion"]
    ]
  },
  {
    id: 5,
    prompt: "List the additional dangers in confined spaces, excluding explosions.",
    solutions: [
      "It is fatal to breathe in an atmosphere with insufficient oxygen, displaced oxygen, or toxic substances.",
      "Confined spaces often trap gases and harmful substances.",
      "It is more difficult to recognise or escape from approaching danger.",
      "It is more difficult to obtain assistance when in distress."
    ],
    keywords: [
      ["fatal","insufficient","oxygen","toxic"],
      ["trap","gases","harmful","substances"],
      ["recognise","escape","approaching","danger"],
      ["obtain","assistance","distress"]
    ]
  },
  {
    id: 7,
    prompt: "What will be the consequences of contravention of the Act and regulations?",
    solutions: [
      "Any contravention of these regulations may be the subject of a full enquiry.",
      "The enquiry may be conducted by staff appointed for this purpose by the Group Executive for Generation or his/her delegate.",
      "Any person who contravenes or fails to comply with any provision of the Act shall be guilty of an offence and may be liable on conviction to a fine, imprisonment, or both."
    ],
    keywords: [
      ["contravention","subject","full","enquiry"],
      ["enquiry","staff","group","executive","generation"],
      ["guilty","offence","fine","imprisonment"]
    ]
  },
  {
    id: 8,
    prompt: "List four duties of the Employer in terms of the OHS Act.",
    solutions: [
      "Ensure that the requirements of the Act and Regulations are met.",
      "Enforce discipline in the workplace.",
      "Educate all employees about dangers in the workplace.",
      "Educate all employees about precautions that must be taken."
    ],
    keywords: [
      ["ensure","requirements","act","regulations"],
      ["enforce","discipline","workplace"],
      ["educate","employees","dangers"],
      ["educate","employees","precautions"]
    ]
  },
  {
    id: 10,
    prompt: "List three dangers of the human element in a power station.",
    solutions: [
      "Breakdown in communication.",
      "Don't-care attitude towards the work.",
      "Working on plant for which a Permit to Work has not been issued."
    ],
    keywords: [
      ["breakdown","communication"],
      ["dont-care","attitude","work"],
      ["permit","work","not","issued"]
    ]
  },
  {
    id: 11,
    prompt: "List four duties of the Employee in terms of the OHS Act.",
    solutions: [
      "Adhere to the Act and the Regulations.",
      "Obey any lawful order.",
      "Report any dangers that come to his/her attention.",
      "Make use of safety equipment."
    ],
    keywords: [
      ["adhere","act","regulations"],
      ["obey","lawful","order"],
      ["report","dangers","attention"],
      ["use","safety","equipment"]
    ]
  },
  {
    id: 13,
    prompt: "List the dangers of electricity in a power station.",
    solutions: [
      "Electricity cannot be seen.",
      "Live apparatus is indistinguishable from dead apparatus.",
      "Flashovers, shock, and arcing can occur."
    ],
    keywords: [
      ["electricity","cannot","seen"],
      ["live","apparatus","indistinguishable","dead"],
      ["flashovers","shock","arcing"]
    ]
  },
  {
    id: 14,
    prompt: "List four dangers of pressure and heat in a power station.",
    solutions: [
      "Uncontrolled pressure rises may exceed material strength and cause explosions.",
      "Dangerous gases may be released into the atmosphere.",
      "Steam may be released and cause serious injuries.",
      "Any fluid at high pressure and temperature will flash over to steam or vapour when exposed to atmospheric pressure."
    ],
    keywords: [
      ["uncontrolled","pressure","explosions"],
      ["dangerous","gases","atmosphere"],
      ["steam","serious","injuries"],
      ["fluid","high","pressure","temperature","flash","steam","vapour"]
    ]
  },
  {
    id: 16,
    prompt: "What should be done if there is any doubt concerning the application of these Regulations?",
    solutions: [
      "The Regulations must be studied to establish the correct procedure.",
      "If the Regulations do not provide the necessary clarity, the problem must be reported to the local member of the Plant Safety Regulations Committee (Authorisation Panel).",
      "The committee member will bring the matter to the attention of the National Committee."
    ],
    keywords: [
      ["studied","correct","procedure"],
      ["clarity","reported","local","member","committee"],
      ["bring","attention","national","committee"]
    ]
  }
];

// -------- STATE --------
let currentQuestionIndex = -1;       // -1 = not started
let testStarted = false;
let testFinished = false;

const totalPossibleMarks = questions.reduce((sum,q)=>sum+q.solutions.length,0);
let score = 0;

// per-question state: {inputs:[], hintUsed:boolean, scored:boolean, questionMark:number}
const questionState = {};
questions.forEach(q=>{
  questionState[q.id] = {
    inputs: Array(q.solutions.length).fill(""),
    hintUsed: false,
    scored: false,
    questionMark: 0
  };
});

let timeLeft = 30 * 60; // 30 minutes in seconds
let timerInterval = null;

const appCard = document.getElementById("app-card");

// -------- HELPERS --------
function makeButton(label, cls, handler){
  const b = document.createElement("button");
  b.textContent = label;
  b.className = cls;
  b.onclick = handler;
  return b;
}
function normalizeText(t){
  return t.trim().toLowerCase().replace(/\s+/g," ");
}
function answerMatches(userText, solution, keywords){
  const u = normalizeText(userText);
  const s = normalizeText(solution);
  if(!u) return false;
  if(u === s) return true;
  if(Array.isArray(keywords) && keywords.length){
    return keywords.every(k => u.includes(k.toLowerCase()));
  }
  return false;
}
function formatTime(sec){
  const m = String(Math.floor(sec/60)).padStart(2,"0");
  const s = String(sec%60).padStart(2,"0");
  return `${m}:${s}`;
}
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  updateTimerDisplay();
  timerInterval = setInterval(()=>{
    timeLeft--;
    if(timeLeft <= 0){
      timeLeft = 0;
      updateTimerDisplay();
      finishTest("Time is up.");
      clearInterval(timerInterval);
    } else {
      updateTimerDisplay();
    }
  },1000);
}
function updateTimerDisplay(){
  const t = document.getElementById("timer-span");
  if(t) t.textContent = formatTime(timeLeft);
}
function launchConfetti(){
  const colors = ["#f97316","#22c55e","#38bdf8","#eab308","#ec4899","#a855f7"];
  for(let i=0;i<150;i++){
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    const color = colors[Math.floor(Math.random()*colors.length)];
    const xOffset = (Math.random()*200-100) + "vw";
    const left = (Math.random()*100) + "vw";
    piece.style.setProperty("--c", color);
    piece.style.setProperty("--x", xOffset);
    piece.style.left = left;
    piece.style.animationDelay = (Math.random()*0.7) + "s";
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(), 3000);
  }
}

// -------- RENDER --------
function render(){
  appCard.innerHTML = "";
  const header = document.createElement("header");
  const left = document.createElement("div");
  const h = document.createElement("h1");
  h.textContent = "PSR Lesson 1 – NB Text Answer Test";
  left.appendChild(h);
  const sub = document.createElement("div");
  sub.className = "subtitle";
  sub.textContent = "Each correct solution = 1 mark. Total = " + totalPossibleMarks + " marks. If Hint is used, that question can score max 1 mark.";
  left.appendChild(sub);
  header.appendChild(left);

  const right = document.createElement("div");
  right.className = "top-right";
  const tLabel = document.createElement("div");
  tLabel.innerHTML = `Time left: <span id="timer-span" class="timer">${formatTime(timeLeft)}</span>`;
  right.appendChild(tLabel);
  const sLabel = document.createElement("div");
  sLabel.className = "score";
  sLabel.textContent = `Score: ${score} / ${totalPossibleMarks}`;
  right.appendChild(sLabel);
  header.appendChild(right);
  appCard.appendChild(header);

  if(!testStarted){
    const intro = document.createElement("div");
    intro.className = "subtitle";
    intro.textContent = "Press Start Test to begin. You will see one NB question at a time.";
    appCard.appendChild(intro);
    const btn = makeButton("Start Test","btn btn-primary",()=>{
      testStarted = true;
      currentQuestionIndex = 0;
      startTimer();
      render();
    });
    appCard.appendChild(btn);
    return;
  }

  if(testFinished){
    renderResultSection();
    return;
  }

  const q = questions[currentQuestionIndex];
  const qs = questionState[q.id];

  const qBlock = document.createElement("div");
  qBlock.className = "question-block";

  const qText = document.createElement("div");
  qText.className = "q-text";
  qText.textContent = `Q${q.id}. ${q.prompt}`;
  qBlock.appendChild(qText);

  const inputsDiv = document.createElement("div");
  inputsDiv.className = "input-row";
  q.solutions.forEach((_, idx)=>{
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Answer " + (idx+1);
    input.value = qs.inputs[idx] || "";
    input.oninput = e => {
      qs.inputs[idx] = e.target.value;
    };
    inputsDiv.appendChild(input);
  });
  qBlock.appendChild(inputsDiv);

  if(qs.hintUsed){
    const hintBox = document.createElement("div");
    hintBox.className = "hint-box";
    hintBox.innerHTML = "<strong>Official solutions:</strong><br>" +
      q.solutions.map((s,i)=>`Answer ${i+1}: ${s}`).join("<br>");
    qBlock.appendChild(hintBox);
  }

  const nav = document.createElement("div");
  nav.className = "nav-row";

  const leftNav = document.createElement("div");
  const hintBtn = makeButton("Hint","btn btn-secondary",()=>{
    qs.hintUsed = true;
    render();
  });
  leftNav.appendChild(hintBtn);

  const submitBtn = makeButton("Submit","btn btn-primary",()=>{
    markCurrentQuestion();
  });
  leftNav.appendChild(submitBtn);
  nav.appendChild(leftNav);

  const rightNav = document.createElement("div");
  const progress = document.createElement("span");
  progress.className = "progress";
  progress.textContent = `Question ${currentQuestionIndex+1} of ${questions.length}`;
  rightNav.appendChild(progress);
  nav.appendChild(rightNav);

  qBlock.appendChild(nav);

  if(qs.scored){
    const fb = document.createElement("div");
    fb.className = "feedback " + (qs.questionMark>0?"good":"bad");
    fb.textContent = `Marked: ${qs.questionMark} mark(s) for this question (out of ${q.solutions.length}).` +
      (qs.hintUsed ? " (Hint used – max 1 mark possible)" : "");
    qBlock.appendChild(fb);

    const nav2 = document.createElement("div");
    nav2.className = "nav-row";
    const spacer = document.createElement("div");
    nav2.appendChild(spacer);
    const nextBtn = makeButton(
      currentQuestionIndex === questions.length-1 ? "Finish" : "Next",
      "btn btn-secondary",
      ()=>{
        if(currentQuestionIndex === questions.length-1){
          finishTest();
        } else {
          currentQuestionIndex++;
          render();
        }
      }
    );
    nav2.appendChild(nextBtn);
    qBlock.appendChild(nav2);
  }

  appCard.appendChild(qBlock);
}

function markCurrentQuestion(){
  const q = questions[currentQuestionIndex];
  const qs = questionState[q.id];

  // remove previous marks for this question from score
  score -= qs.questionMark;

  let correctCount = 0;
  q.solutions.forEach((sol, idx)=>{
    const kw = (q.keywords && q.keywords[idx]) ? q.keywords[idx] : [];
    const ok = answerMatches(qs.inputs[idx] || "", sol, kw);
    if(ok) correctCount++;
  });

  let newMark;
  if(qs.hintUsed){
    // if at least one correct, give 1 mark max
    newMark = correctCount > 0 ? 1 : 0;
  } else {
    newMark = correctCount;
  }

  qs.questionMark = newMark;
  qs.scored = true;
  score += newMark;

  render();
}

function finishTest(reason){
  if(testFinished) return
  testFinished = true;
  if(timerInterval) clearInterval(timerInterval);
  renderResultSection(reason);
}

function renderResultSection(reason){
  appCard.innerHTML = "";

  const h = document.createElement("h1");
  h.textContent = "Test Completed";
  appCard.appendChild(h);

  if(reason){
    const r = document.createElement("div");
    r.className = "subtitle";
    r.textContent = reason;
    appCard.appendChild(r);
  }

  const resultDiv = document.createElement("div");
  resultDiv.className = "result";

  const passed = score === totalPossibleMarks;
  const percent = (score / totalPossibleMarks) * 100;

  const statusTag = `<span class="status-tag ${passed?"status-pass":"status-fail"}">${passed?"PASS (100%)":"FAIL"}</span>`;
  resultDiv.innerHTML =
    `Final score: ${score} / ${totalPossibleMarks} (${percent.toFixed(1)}%) ${statusTag}`;

  appCard.appendChild(resultDiv);

  const summaryTitle = document.createElement("div");
  summaryTitle.style.marginTop = "8px";
  summaryTitle.textContent = "Question breakdown:";
  appCard.appendChild(summaryTitle);

  questions.forEach((q, idx)=>{
    const qs = questionState[q.id];
    const item = document.createElement("div");
    item.className = "summary-item";
    const maxForQ = q.solutions.length;
    item.textContent =
      `Q${q.id} (${idx+1}/${questions.length}): ${qs.questionMark} / ${maxForQ}` +
      (qs.hintUsed ? " (Hint used)" : "");
    appCard.appendChild(item);
  });

  if(passed){
    launchConfetti();
  }

  const restartDiv = document.createElement("div");
  restartDiv.style.marginTop = "12px";
  restartDiv.appendChild(
    makeButton("Restart Test","btn btn-secondary",()=>{
      // reset state
      score = 0;
      timeLeft = 30 * 60;
      Object.keys(questionState).forEach(id=>{
        const st = questionState[id];
        st.inputs = st.inputs.map(()=> "");
        st.hintUsed = false;
        st.scored = false;
        st.questionMark = 0;
      });
      currentQuestionIndex = -1;
      testStarted = false;
      testFinished = false;
      startTimer();
      render();
    })
  );
  appCard.appendChild(restartDiv);
}

// initial render
render();
</script>
</body>
</html>
