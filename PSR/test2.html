<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PSR Lesson 1 – NB Test (Text Answers)</title>
<style>
  body{
    font-family:system-ui,Segoe UI,Roboto,Arial;
    margin:0;
    padding:0;
    background:#050710;
    color:#f5f7ff;
  }
  .app{max-width:1000px;margin:0 auto;padding:20px;}
  .card{
    background:#111827;
    border-radius:10px;
    padding:18px;
    box-shadow:0 8px 24px rgba(0,0,0,0.7);
  }
  h1{margin:0 0 10px;font-size:22px;color:#e5e7eb}
  .btn{
    display:inline-block;
    padding:10px 14px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    font-size:14px;
    font-weight:500;
    margin-right:8px;
    margin-bottom:8px;
  }
  .btn-primary{background:#2563eb;color:#f9fafb}
  .btn-secondary{background:#374151;color:#e5e7eb}
  .btn:disabled{opacity:0.5;cursor:default}
  .mode-title{font-size:14px;color:#9ca3af;margin-bottom:6px}
  .question-block{
    border-top:1px solid #1f2937;
    padding:12px 0;
  }
  .q-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .q-text{font-weight:600;color:#f9fafb}
  .q-tag{
    padding:2px 6px;
    border-radius:4px;
    font-size:11px;
    font-weight:600;
    background:#b45309;
    color:#fffbeb;
  }
  .answer-pill{
    margin-top:6px;
    padding:8px 10px;
    border-radius:6px;
    background:#020617;
    border:1px solid #1f2937;
    cursor:pointer;
    font-size:14px;
    color:#e5e7eb;
  }
  .answer-pill.learned{
    background:#064e3b;
    border-color:#22c55e;
    color:#ecfdf5;
  }
  .answer-pill small{display:block;font-size:11px;opacity:0.7}
  .stats{font-size:13px;color:#9ca3af;margin:6px 0}
  .input-row{margin-top:6px;display:flex;flex-direction:column;gap:4px}
  input[type="text"]{
    width:100%;
    padding:8px 10px;
    border-radius:6px;
    border:1px solid #374151;
    background:#020617;
    color:#e5e7eb;
    font-size:14px;
  }
  input[type="text"]:focus{outline:none;border-color:#38bdf8}
  .hint-box{
    margin-top:6px;
    padding:8px 10px;
    border-radius:6px;
    background:#0f172a;
    border:1px dashed #38bdf8;
    font-size:13px;
    color:#e0f2fe;
  }
  .test-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    font-size:14px;
    color:#d1d5db;
  }
  .result{
    margin-top:12px;
    padding:10px;
    border-radius:8px;
    border:1px solid #38bdf8;
    background:#020617;
    font-size:14px;
  }
  .result.pass{border-color:#22c55e}
  .result.fail{border-color:#ef4444}
  .status-tag{
    display:inline-block;
    margin-left:6px;
    padding:2px 6px;
    border-radius:4px;
    font-size:12px;
    font-weight:600;
  }
  .status-pass{background:#14532d;color:#bbf7d0}
  .status-fail{background:#7f1d1d;color:#fecaca}
  .confetti-piece{
    position:fixed;
    width:8px;
    height:14px;
    background:var(--c);
    top:-20px;
    left:50%;
    opacity:0.9;
    pointer-events:none;
    animation:fall 2.7s linear forwards;
    z-index:9999;
  }
  @keyframes fall{
    0%{transform:translate3d(0,0,0) rotateZ(0deg);}
    100%{transform:translate3d(var(--x),110vh,0) rotateZ(360deg);}
  }
</style>
</head>
<body>
<div class="app">
  <div class="card" id="app-card"></div>
</div>

<script>
// NB questions only
const questions = [
  {
    id: 1,
    prompt: "State the purpose of the Plant Safety Regulations.",
    solutions: [
      "To specify and provide requirements for the application of compulsory health and safety measures for all plant and for all persons who work on plant or machinery under the control of Eskom Generation."
    ],
    keywords: [
      ["specify","requirements","compulsory","health","safety","plant","persons"]
    ]
  },
  {
    id: 2,
    prompt: "List three dangers of movement.",
    solutions: [
      "Personal injury to persons in the vicinity.",
      "Damage to plant or equipment.",
      "Danger to the public or environment."
    ],
    keywords: [
      ["personal","injury"],
      ["damage","plant"],
      ["danger","public"]
    ]
  },
  {
    id: 3,
    prompt: "List three responsibilities of every Authorised person who is in possession of a copy of the Regulations.",
    solutions: [
      "Be held responsible for the knowledge and application of the Regulations.",
      "Must maintain his copy of the Regulations in good condition and up to date.",
      "Must ensure that the latest revision of the Regulations is readily available where required."
    ],
    keywords: [
      ["responsible","knowledge","application"],
      ["maintain","copy","up","to","date"],
      ["latest","revision"]
    ]
  },
  {
    id: 4,
    prompt: "How can explosions occur in confined spaces?",
    solutions: [
      "Suspension of flammable dust or vapour in air in a certain proportion.",
      "Presence of flammable gases or vapours such as hydrogen, LPG, gas, acetylene and petrol vapours.",
      "There must be a source of ignition or spontaneous combustion."
    ],
    keywords: [
      ["suspension","dust","vapour","air"],
      ["flammable","gases"],
      ["source","ignition"]
    ]
  },
  {
    id: 5,
    prompt: "List the additional dangers in confined spaces, excluding explosions.",
    solutions: [
      "Insufficient oxygen for the functioning of the human body.",
      "Presence of inert gases that displace oxygen.",
      "Presence of toxic gases or vapours.",
      "Engulfment by loose material such as ash or coal.",
      "Restricted movement, difficult access and egress.",
      "Poor lighting and visibility.",
      "More difficult to obtain assistance when in distress."
    ],
    keywords: [
      ["insufficient","oxygen"],
      ["inert","gases","displace"],
      ["toxic","gases"],
      ["engulfment"],
      ["restricted","movement"],
      ["poor","lighting"],
      ["assistance","distress"]
    ]
  },
  {
    id: 7,
    prompt: "What will be the consequences of contravention of the Act and Regulations?",
    solutions: [
      "Any persons who contravene or fail to comply with any provision of this Act shall be guilty of an offence.",
      "Such persons may be liable to the penalties prescribed by the Act.",
      "The employer may also take disciplinary action where applicable."
    ],
    keywords: [
      ["contravene","offence"],
      ["liable","penalties"],
      ["disciplinary","action"]
    ]
  },
  {
    id: 8,
    prompt: "How shall the Regulations be interpreted?",
    solutions: [
      "The Regulations must be interpreted as minimum requirements for safety of personnel, plant and the environment.",
      "Where there is conflict between a local procedure and these Regulations, these Regulations shall prevail.",
      "The PSR and OHS Act and Regulations shall be read together as an extension of each other."
    ],
    keywords: [
      ["minimum","requirements","safety"],
      ["conflict","local","procedure","prevail"],
      ["extension","ohs"]
    ]
  },
  {
    id: 10,
    prompt: "List three dangers of the human element in a power station.",
    solutions: [
      "Breakdown in communication.",
      "Incorrect actions that cause accidents.",
      "Work on plant for which a Permit to Work is not issued."
    ],
    keywords: [
      ["breakdown","communication"],
      ["incorrect","actions"],
      ["permit","not","issued"]
    ]
  },
  {
    id: 11,
    prompt: "List four duties of the employee in terms of the OHS Act.",
    solutions: [
      "Take reasonable care for the health and safety of himself and others.",
      "Obey any lawful order and obey the health and safety rules and procedures.",
      "Report unsafe or unhealthy conditions to the employer or safety representative.",
      "Co-operate with the employer to comply with the Act."
    ],
    keywords: [
      ["reasonable","care","health","safety"],
      ["obey","lawful","order"],
      ["report","unsafe","conditions"],
      ["co-operate","employer"]
    ]
  },
  {
    id: 13,
    prompt: "List five dangers of electricity in a power station.",
    solutions: [
      "Electric shock which may cause death or injury.",
      "Burns from contact with live conductors or from arcing.",
      "Fires and explosions.",
      "Flashovers and arcs which may cause injury.",
      "Induced voltages and step or touch potentials."
    ],
    keywords: [
      ["electric","shock"],
      ["burns"],
      ["fires","explosions"],
      ["flashovers","arcs"],
      ["induced","voltages"]
    ]
  },
  {
    id: 14,
    prompt: "List the four dangers of pressure and heat in a power station.",
    solutions: [
      "Uncontrolled pressure rise may increase above the material strength and cause explosions.",
      "Sudden release of pressure may cause serious injury.",
      "Hot surfaces and steam may cause severe burns.",
      "Hot gases which may be dangerous are released to atmosphere."
    ],
    keywords: [
      ["uncontrolled","pressure","explosions"],
      ["sudden","release","injury"],
      ["hot","surfaces","burns"],
      ["hot","gases","dangerous"]
    ]
  },
  {
    id: 16,
    prompt: "How shall training manuals, decision registers and any local procedures and instructions be regarded?",
    solutions: [
      "They shall be regarded as an extension of the Plant Safety Regulations.",
      "They shall not conflict with these Regulations.",
      "If a conflict exists, the PSR and OHS Act and its Regulations shall prevail."
    ],
    keywords: [
      ["extension","plant","safety"],
      ["not","conflict"],
      ["prevail","ohs"]
    ]
  }
];

let currentView = "menu"; // menu | learn | test
let testAnswers = {}; // { qId: {inputs:[], hintUsed, correct} }
let learnedAnswers = new Set();
const appCard = document.getElementById("app-card");

// helpers
function makeButton(label, cls, handler){
  const b = document.createElement("button");
  b.textContent = label;
  b.className = cls;
  b.onclick = handler;
  return b;
}
function normalizeText(t){
  return t.trim().toLowerCase().replace(/\s+/g," ");
}
function answerMatches(userText, solution, keywords){
  const u = normalizeText(userText);
  const s = normalizeText(solution);
  if(!u) return false;
  if(u === s) return true;
  if(Array.isArray(keywords) && keywords.length){
    return keywords.every(k => u.indexOf(k.toLowerCase()) !== -1);
  }
  return false;
}
function launchConfetti(){
  const colors = ["#f97316","#22c55e","#38bdf8","#eab308","#ec4899","#a855f7"];
  for(let i=0;i<150;i++){
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    const color = colors[Math.floor(Math.random()*colors.length)];
    const xOffset = (Math.random()*200-100) + "vw";
    const left = (Math.random()*100) + "vw";
    piece.style.setProperty("--c", color);
    piece.style.setProperty("--x", xOffset);
    piece.style.left = left;
    piece.style.animationDelay = (Math.random()*0.7) + "s";
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(), 3000);
  }
}

// render
function renderApp(){
  if(currentView === "menu") renderMenu();
  else if(currentView === "learn") renderLearn();
  else if(currentView === "test") renderTest();
}

function renderMenu(){
  appCard.innerHTML = "";
  const h = document.createElement("h1");
  h.textContent = "PSR Lesson 1 – NB Text Test";
  appCard.appendChild(h);
  const info = document.createElement("div");
  info.className = "mode-title";
  info.textContent = "Use Learn first, then take the Lesson 1 NB test. Pass mark is 100%.";
  appCard.appendChild(info);
  appCard.appendChild(makeButton("Learn","btn btn-primary",()=>{
    currentView="learn";renderApp();
  }));
  appCard.appendChild(makeButton("Lesson 1 Test (NB only)","btn btn-secondary",()=>{
    startTest(); 
  }));
}

function renderLearn(){
  appCard.innerHTML = "";
  const h = document.createElement("h1");
  h.textContent = "Learn – Lesson 1 NB Questions";
  appCard.appendChild(h);
  appCard.appendChild(makeButton("Back to menu","btn btn-secondary",()=>{
    currentView="menu";renderApp();
  }));
  const info = document.createElement("div");
  info.className = "mode-title";
  info.textContent = "Click each answer when you have learned it. All answers must be green before starting the test.";
  appCard.appendChild(info);

  let total = 0;
  questions.forEach(q=> total+=q.solutions.length);
  const stats = document.createElement("div");
  stats.className = "stats";
  stats.textContent = `Learned answers: ${learnedAnswers.size} / ${total}`;
  appCard.appendChild(stats);

  questions.forEach(q=>{
    const qb = document.createElement("div");
    qb.className = "question-block";
    const head = document.createElement("div");
    head.className = "q-header";
    const qt = document.createElement("div");
    qt.className = "q-text";
    qt.textContent = `Q${q.id}. ${q.prompt}`;
    head.appendChild(qt);
    const tag = document.createElement("span");
    tag.className = "q-tag";
    tag.textContent = "NB";
    head.appendChild(tag);
    qb.appendChild(head);

    q.solutions.forEach((sol,idx)=>{
      const key = `${q.id}-${idx}`;
      const pill = document.createElement("div");
      pill.className = "answer-pill";
      if(learnedAnswers.has(key)) pill.classList.add("learned");
      pill.innerHTML = `<strong>Answer ${idx+1}:</strong> ${sol}<small>Click to toggle learned</small>`;
      pill.onclick = ()=>{
        if(learnedAnswers.has(key)) learnedAnswers.delete(key);
        else learnedAnswers.add(key);
        renderLearn();
      };
      qb.appendChild(pill);
    });

    appCard.appendChild(qb);
  });

  if(learnedAnswers.size === total){
    const s = document.createElement("div");
    s.style.marginTop = "8px";
    s.appendChild(makeButton("Start Lesson 1 NB Test","btn btn-primary",()=>{
      startTest();
    }));
    appCard.appendChild(s);
  }
}

function startTest(){
  currentView = "test";
  testAnswers = {};
  renderApp();
}

function renderTest(){
  appCard.innerHTML = "";
  const head = document.createElement("div");
  head.className = "test-header";
  const left = document.createElement("div");
  left.textContent = "Lesson 1 Test – NB Questions";
  head.appendChild(left);
  const right = document.createElement("div");
  right.appendChild(makeButton("Back to menu","btn btn-secondary",()=>{
    currentView="menu";renderApp();
  }));
  head.appendChild(right);
  appCard.appendChild(head);

  const info = document.createElement("div");
  info.className = "mode-title";
  info.textContent = "Type your answers. If you use Hint for a question, that question scores 0.";
  appCard.appendChild(info);

  questions.forEach(q=>{
    if(!testAnswers[q.id]){
      testAnswers[q.id] = {inputs:Array(q.solutions.length).fill(""), hintUsed:false, correct:false};
    }
    const qa = testAnswers[q.id];

    const qb = document.createElement("div");
    qb.className = "question-block";

    const h = document.createElement("div");
    h.className = "q-header";
    const qt = document.createElement("div");
    qt.className = "q-text";
    qt.textContent = `Q${q.id}. ${q.prompt}`;
    h.appendChild(qt);
    const hintBtn = makeButton("Hint","btn btn-secondary",()=>{
      qa.hintUsed = true;
      renderTest();
    });
    h.appendChild(hintBtn);
    qb.appendChild(h);

    const inpWrap = document.createElement("div");
    inpWrap.className = "input-row";
    q.solutions.forEach((_,idx)=>{
      const input = document.createElement("input");
      input.type="text";
      input.placeholder="Answer "+(idx+1);
      input.value = qa.inputs[idx] || "";
      input.oninput = e=>{
        qa.inputs[idx] = e.target.value;
      };
      inpWrap.appendChild(input);
    });
    qb.appendChild(inpWrap);

    if(qa.hintUsed){
      const hintBox = document.createElement("div");
      hintBox.className="hint-box";
      hintBox.innerHTML = "<strong>Answers:</strong><br>"+q.solutions.map((s,i)=>`Answer ${i+1}: ${s}`).join("<br>");
      qb.appendChild(hintBox);
    }

    appCard.appendChild(qb);
  });

  const bottom = document.createElement("div");
  bottom.style.marginTop="10px";
  bottom.appendChild(makeButton("Mark test (pass mark 100%)","btn btn-primary",markTest));
  appCard.appendChild(bottom);
}

function markTest(){
  let totalQ = questions.length;
  let correctQ = 0;

  questions.forEach(q=>{
    const qa = testAnswers[q.id] || {inputs:[], hintUsed:true};
    if(qa.hintUsed){ qa.correct=false; return; }
    let allOk = true;
    q.solutions.forEach((sol,idx)=>{
      const kw = (q.keywords && q.keywords[idx]) ? q.keywords[idx] : [];
      const ok = answerMatches(qa.inputs[idx] || "", sol, kw);
      if(!ok) allOk=false;
    });
    qa.correct = allOk;
    if(allOk) correctQ++;
  });

  const percent = (correctQ/totalQ)*100;
  const passed = correctQ === totalQ;

  let res = document.querySelector(".result");
  if(!res){
    res = document.createElement("div");
    res.className="result";
    appCard.appendChild(res);
  }
  res.className = "result " + (passed?"pass":"fail");
  const tag = `<span class="status-tag ${passed?"status-pass":"status-fail"}">${passed?"PASS (100%)":"FAIL"}</span>`;
  res.innerHTML = `Score: ${correctQ} / ${totalQ} (${percent.toFixed(1)}%) ${tag}`;

  if(passed) launchConfetti();
}

renderApp();
</script>
</body>
</html>
