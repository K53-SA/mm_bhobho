<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSR Lesson 1 – NB Text Test</title>
<style>
  body{
    font-family:system-ui,Segoe UI,Roboto,Arial;
    margin:0;
    padding:0;
    background:#020617;
    color:#f9fafb;
  }
  .app{max-width:1000px;margin:0 auto;padding:24px 16px 40px;}
  .card{
    background:#0b1120;
    border-radius:12px;
    padding:20px 18px;
    box-shadow:0 18px 45px rgba(0,0,0,0.8);
    border:1px solid #1f2937;
  }
  h1{margin:0 0 8px;font-size:22px;color:#e5e7eb}
  .subtitle{font-size:13px;color:#9ca3af;margin-bottom:10px}
  .btn{
    display:inline-block;
    padding:9px 13px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    font-size:14px;
    font-weight:500;
    margin-right:8px;
    margin-bottom:8px;
  }
  .btn-primary{background:#2563eb;color:#f9fafb}
  .btn-secondary{background:#111827;color:#e5e7eb;border:1px solid #374151}
  .btn:disabled{opacity:0.45;cursor:default}
  .mode-title{font-size:14px;color:#9ca3af;margin-bottom:8px}
  .question-block{
    border-top:1px solid #111827;
    padding:14px 0;
  }
  .q-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .q-text{font-weight:600;font-size:14px;color:#f9fafb}
  .answer-pill{
    margin-top:6px;
    padding:8px 10px;
    border-radius:8px;
    background:#020617;
    border:1px solid #1f2937;
    cursor:pointer;
    font-size:13px;
    color:#e5e7eb;
  }
  .answer-pill.learned{
    background:#064e3b;
    border-color:#22c55e;
    color:#ecfdf5;
  }
  .answer-pill small{display:block;font-size:11px;opacity:0.7}
  .stats{font-size:13px;color:#9ca3af;margin:6px 0 10px}
  .input-row{margin-top:6px;display:flex;flex-direction:column;gap:5px}
  input[type="text"]{
    width:100%;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid #374151;
    background:#020617;
    color:#e5e7eb;
    font-size:13px;
  }
  input[type="text"]:focus{
    outline:none;
    border-color:#38bdf8;
    box-shadow:0 0 0 1px #0ea5e9;
  }
  .hint-box{
    margin-top:6px;
    padding:8px 10px;
    border-radius:8px;
    background:#111827;
    border:1px dashed #38bdf8;
    font-size:13px;
    color:#e0f2fe;
  }
  .test-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-size:14px;
    color:#d1d5db;
  }
  .result{
    margin-top:14px;
    padding:10px;
    border-radius:10px;
    border:1px solid #38bdf8;
    background:#020617;
    font-size:14px;
  }
  .result.pass{border-color:#22c55e}
  .result.fail{border-color:#ef4444}
  .status-tag{
    display:inline-block;
    margin-left:6px;
    padding:2px 6px;
    border-radius:4px;
    font-size:12px;
    font-weight:600;
  }
  .status-pass{background:#14532d;color:#bbf7d0}
  .status-fail{background:#7f1d1d;color:#fecaca}
  .confetti-piece{
    position:fixed;
    width:8px;
    height:14px;
    background:var(--c);
    top:-20px;
    left:50%;
    opacity:0.9;
    pointer-events:none;
    animation:fall 2.7s linear forwards;
    z-index:9999;
  }
  @keyframes fall{
    0%{transform:translate3d(0,0,0) rotateZ(0deg);}
    100%{transform:translate3d(var(--x),110vh,0) rotateZ(360deg);}
  }
</style>
</head>
<body>
<div class="app">
  <div class="card" id="app-card"></div>
</div>

<script>
// NOTE: You MUST replace each TODO line below with the exact text from Lesson 1 solutions.pdf.
// This file already has all NB questions and correct number of solutions per question.

const questions = [
  // Q1 – 3 solutions
  {
    id: 1,
    prompt: "State the purpose of the Plant Safety Regulations.",
    solutions: [
      "TODO: paste Q1 solution line 1 here",
      "TODO: paste Q1 solution line 2 here",
      "TODO: paste Q1 solution line 3 here"
    ],
    keywords: [[],[],[]]
  },
  // Q2 – 3 solutions (example filled from your PDF)
  {

    solutions: [

    ],
    keywords: [

      ["trapped","moving","load","fixed","object"]
    ]
  },
  // Q3 – 3 solutions
  {
    id: 3,
    prompt: "List three responsibilities of every Authorised person who is in possession of a copy of the Regulations.",
    solutions: [
      "TODO: paste Q3 solution line 1 here",
      "TODO: paste Q3 solution line 2 here",

    ],
    keywords: [[],[],[]]
  },
  // Q4 – 3 solutions
  {
    id: 4,
    prompt: "How can explosions occur in confined spaces?",
    solutions: [
      "TODO: paste Q4 solution line 1 here",
      "TODO: paste Q4 solution line 2 here",
      "TODO: paste Q4 solution line 3 here"
    ],
    keywords: [[],[],[]]
  },
  // Q5 – 7 solutions
  {
    id: 5,
    prompt: "List the additional dangers in confined spaces, excluding explosions.",
    solutions: [
      "TODO: paste Q5 solution line 1 here",
      "TODO: paste Q5 solution line 2 here",
      "TODO: paste Q5 solution line 3 here",
      "TODO: paste Q5 solution line 4 here",
      "TODO: paste Q5 solution line 5 here",
      "TODO: paste Q5 solution line 6 here",
      "TODO: paste Q5 solution line 7 here"
    ],
    keywords: [[],[],[],[],[],[],[]]
  },
  // Q7 – 3 solutions
  {
    id: 7,
    prompt: "What will be the consequences of contravention of the Act and Regulations?",
    solutions: [
      "TODO: paste Q7 solution line 1 here",
      "TODO: paste Q7 solution line 2 here",
      "TODO: paste Q7 solution line 3 here"
    ],
    keywords: [[],[],[]]
  },
  // Q8 – 3 solutions
  {
    id: 8,
    prompt: "How shall the Regulations be interpreted?",
    solutions: [
      "TODO: paste Q8 solution line 1 here",
      "TODO: paste Q8 solution line 2 here",
      "TODO: paste Q8 solution line 3 here"
    ],
    keywords: [[],[],[]]
  },
  // Q10 – 3 solutions
  {
    id: 10,
    prompt: "List three dangers of the human element in a power station.",
    solutions: [
      "TODO: paste Q10 solution line 1 here",
      "TODO: paste Q10 solution line 2 here",
      "TODO: paste Q10 solution line 3 here"
    ],
    keywords: [[],[],[]]
  },
  // Q11 – 4 solutions
  {
    id: 11,
    prompt: "List four duties of the employee in terms of the OHS Act.",
    solutions: [
      "TODO: paste Q11 solution line 1 here",
      "TODO: paste Q11 solution line 2 here",
      "TODO: paste Q11 solution line 3 here",
      "TODO: paste Q11 solution line 4 here"
    ],
    keywords: [[],[],[],[]]
  },
  // Q13 – 3 solutions
  {
    id: 13,
    prompt: "List three dangers of electricity in a power station.",
    solutions: [
      "TODO: paste Q13 solution line 1 here",
      "TODO: paste Q13 solution line 2 here",
      "TODO: paste Q13 solution line 3 here"
    ],
    keywords: [[],[],[]]
  },
  // Q14 – 4 solutions
  {
    id: 14,
    prompt: "List four dangers of pressure and heat in a power station.",
    solutions: [
      "TODO: paste Q14 solution line 1 here",
      "TODO: paste Q14 solution line 2 here",
      "TODO: paste Q14 solution line 3 here",
      "TODO: paste Q14 solution line 4 here"
    ],
    keywords: [[],[],[],[]]
  },
  // Q16 – 3 solutions
  {
    id: 16,
    prompt: "What should be done if there is any doubt concerning the application of these Regulations?",
    solutions: [
      "TODO: paste Q16 solution line 1 here",
      "TODO: paste Q16 solution line 2 here",
      "TODO: paste Q16 solution line 3 here"
    ],
    keywords: [[],[],[]]
  }
];

let currentView = "menu"; // menu | learn | test
let learnedAnswers = new Set();
let testAnswers = {}; // { qId: {inputs:[], hintUsed, correct} }
const appCard = document.getElementById("app-card");

function makeButton(label, cls, handler){
  const b = document.createElement("button");
  b.textContent = label;
  b.className = cls;
  b.onclick = handler;
  return b;
}
function normalizeText(t){
  return t.trim().toLowerCase().replace(/\s+/g," ");
}
function answerMatches(userText, solution, keywords){
  const u = normalizeText(userText);
  const s = normalizeText(solution);
  if(!u) return false;
  if(u === s) return true;
  if(Array.isArray(keywords) && keywords.length){
    return keywords.every(k => u.indexOf(k.toLowerCase()) !== -1);
  }
  return false;
}
function launchConfetti(){
  const colors = ["#f97316","#22c55e","#38bdf8","#eab308","#ec4899","#a855f7"];
  for(let i=0;i<150;i++){
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    const color = colors[Math.floor(Math.random()*colors.length)];
    const xOffset = (Math.random()*200-100) + "vw";
    const left = (Math.random()*100) + "vw";
    piece.style.setProperty("--c", color);
    piece.style.setProperty("--x", xOffset);
    piece.style.left = left;
    piece.style.animationDelay = (Math.random()*0.7) + "s";
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(), 3000);
  }
}

function renderApp(){
  if(currentView === "menu") renderMenu();
  else if(currentView === "learn") renderLearn();
  else if(currentView === "test") renderTest();
}

function renderMenu(){
  appCard.innerHTML = "";
  const h = document.createElement("h1");
  h.textContent = "PSR Lesson 1 – NB Text Test";
  appCard.appendChild(h);
  const sub = document.createElement("div");
  sub.className = "subtitle";
  sub.textContent = "Learn the NB answers, then take the NB test. Pass mark is 100%.";
  appCard.appendChild(sub);
  appCard.appendChild(makeButton("Learn","btn btn-primary",()=>{currentView="learn";renderApp();}));
  appCard.appendChild(makeButton("Lesson 1 NB Test","btn btn-secondary",()=>{startTest();}));
}

function renderLearn(){
  appCard.innerHTML = "";
  const h = document.createElement("h1");
  h.textContent = "Learn – Lesson 1 NB Questions";
  appCard.appendChild(h);
  appCard.appendChild(makeButton("Back to menu","btn btn-secondary",()=>{currentView="menu";renderApp();}));
  const info = document.createElement("div");
  info.className = "mode-title";
  info.textContent = "Click each answer when you have learned it. All answers must be green before starting the test.";
  appCard.appendChild(info);
  let total=0;
  questions.forEach(q=> total+=q.solutions.length);
  const stats = document.createElement("div");
  stats.className="stats";
  stats.textContent = `Learned answers: ${learnedAnswers.size} / ${total}`;
  appCard.appendChild(stats);

  questions.forEach(q=>{
    const qb = document.createElement("div");
    qb.className="question-block";
    const head = document.createElement("div");
    head.className="q-header";
    const qt = document.createElement("div");
    qt.className="q-text";
    qt.textContent = `Q${q.id}. ${q.prompt}`;
    head.appendChild(qt);
    qb.appendChild(head);
    q.solutions.forEach((sol,idx)=>{
      const key = `${q.id}-${idx}`;
      const pill = document.createElement("div");
      pill.className="answer-pill";
      if(learnedAnswers.has(key)) pill.classList.add("learned");
      pill.innerHTML = `<strong>Answer ${idx+1}:</strong> ${sol}<small>Click to toggle learned</small>`;
      pill.onclick = ()=>{
        if(learnedAnswers.has(key)) learnedAnswers.delete(key);
        else learnedAnswers.add(key);
        renderLearn();
      };
      qb.appendChild(pill);
    });
    appCard.appendChild(qb);
  });

  if(learnedAnswers.size === total){
    const s = document.createElement("div");
    s.style.marginTop="8px";
    s.appendChild(makeButton("Start Lesson 1 NB Test","btn btn-primary",()=>{startTest();}));
    appCard.appendChild(s);
  }
}

function startTest(){
  currentView="test";
  testAnswers={};
  renderApp();
}

function renderTest(){
  appCard.innerHTML="";
  const head = document.createElement("div");
  head.className="test-header";
  const left = document.createElement("div");
  left.textContent="Lesson 1 NB Test";
  head.appendChild(left);
  const right = document.createElement("div");
  right.appendChild(makeButton("Back to menu","btn btn-secondary",()=>{currentView="menu";renderApp();}));
  head.appendChild(right);
  appCard.appendChild(head);

  const info = document.createElement("div");
  info.className="mode-title";
  info.textContent="Type your answers. If you use Hint for a question, that question scores 0.";
  appCard.appendChild(info);

  questions.forEach(q=>{
    if(!testAnswers[q.id]) testAnswers[q.id]={inputs:Array(q.solutions.length).fill(""),hintUsed:false,correct:false};
    const qa=testAnswers[q.id];
    const qb=document.createElement("div");
    qb.className="question-block";
    const h=document.createElement("div");
    h.className="q-header";
    const qt=document.createElement("div");
    qt.className="q-text";
    qt.textContent=`Q${q.id}. ${q.prompt}`;
    h.appendChild(qt);
    const hintBtn=makeButton("Hint","btn btn-secondary",()=>{qa.hintUsed=true;renderTest();});
    h.appendChild(hintBtn);
    qb.appendChild(h);

    const inpWrap=document.createElement("div");
    inpWrap.className="input-row";
    q.solutions.forEach((_,idx)=>{
      const input=document.createElement("input");
      input.type="text";
      input.placeholder="Answer "+(idx+1);
      input.value=qa.inputs[idx]||"";
      input.oninput=e=>{qa.inputs[idx]=e.target.value;};
      inpWrap.appendChild(input);
    });
    qb.appendChild(inpWrap);

    if(qa.hintUsed){
      const hintBox=document.createElement("div");
      hintBox.className="hint-box";
      hintBox.innerHTML="<strong>Official answers:</strong><br>"+q.solutions.map((s,i)=>`Answer ${i+1}: ${s}`).join("<br>");
      qb.appendChild(hintBox);
    }
    appCard.appendChild(qb);
  });

  const bottom=document.createElement("div");
  bottom.style.marginTop="10px";
  bottom.appendChild(makeButton("Mark test (pass mark 100%)","btn btn-primary",markTest));
  appCard.appendChild(bottom);
}

function markTest(){
  const totalQ=questions.length;
  let correctQ=0;
  questions.forEach(q=>{
    const qa=testAnswers[q.id]||{inputs:[],hintUsed:true};
    if(qa.hintUsed){qa.correct=false;return;}
    let allOk=true;
    q.solutions.forEach((sol,idx)=>{
      const kw=(q.keywords&&q.keywords[idx])?q.keywords[idx]:[];
      if(!answerMatches(qa.inputs[idx]||"",sol,kw)) allOk=false;
    });
    qa.correct=allOk;
    if(allOk) correctQ++;
  });
  const percent=(correctQ/totalQ)*100;
  const passed=correctQ===totalQ;
  let res=document.querySelector(".result");
  if(!res){
    res=document.createElement("div");
    res.className="result";
    appCard.appendChild(res);
  }
  res.className="result "+(passed?"pass":"fail");
  const tag=`<span class="status-tag ${passed?"status-pass":"status-fail"}">${passed?"PASS (100%)":"FAIL"}</span>`;
  res.innerHTML=`Score: ${correctQ} / ${totalQ} (${percent.toFixed(1)}%) ${tag}`;
  if(passed) launchConfetti();
}

renderApp();
</script>
</body>
</html>
