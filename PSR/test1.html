<!DOCTYPE html>2<html lang="en">3<head>4<meta charset="UTF-8">5<meta name="viewport" content="width=device-width, initial-scale=1.0">6<title>Plant Safety Regulations Test</title>7 8<style>9    *{10        box-sizing:border-box;11        font-family:Arial, sans-serif;12    }13 14    body{15        background:#f4f6f9;16        padding:20px;17    }18 19    .container{20        max-width:900px;21        margin:auto;22        background:white;23        padding:25px;24        border-radius:10px;25        box-shadow:0 0 10px rgba(0,0,0,0.1);26    }27 28    h1{29        text-align:center;30        color:#333;31    }32 33    #timer{34        text-align:center;35        font-size:24px;36        font-weight:bold;37        color:#d32f2f;38        margin-bottom:20px;39    }40 41    .question{42        margin-bottom:25px;43        padding:15px;44        border:1px solid #ddd;45        border-radius:8px;46    }47 48    .question h3{49        margin-bottom:10px;50    }51 52    .option{53        display:block;54        width:100%;55        margin:8px 0;56        padding:12px;57        border:none;58        cursor:pointer;59        background:#e9ecef;60        border-radius:5px;61        text-align:left;62        transition:0.3s;63    }64 65    .option:hover{66        background:#d6dbe1;67    }68 69    .correct{70        background:#28a745 !important;71        color:white;72    }73 74    .wrong{75        background:#dc3545 !important;76        color:white;77    }78 79    .disabled{80        pointer-events:none;81    }82 83    #submitBtn{84        display:block;85        margin:auto;86        padding:12px 25px;87        font-size:16px;88        background:#0078d4;89        color:white;90        border:none;91        border-radius:5px;92        cursor:pointer;93    }94 95    #result{96        text-align:center;97        font-size:24px;98        font-weight:bold;99        margin-top:20px;100    }101</style>102</head>103<body>104 105<div class="container">106 107    <h1>Plant Safety Regulations Test</h1>108 109    <div id="timer">15:00</div>110 111    <div id="quiz"></div>112 113    <button id="submitBtn" onclick="endQuiz()">Finish Test</button>114 115    <div id="result"></div>116 117</div>118 119<script>120 121const questions = [122 123{124question: "State what is by definition 'Work'?",125options: [126"All human activities in connection with the plant",127"Activities carried out by a skilled person",128"Only activities requiring supervision",129"Operating activities only"130],131answer: 0132},133 134{135question: "State what is defined as 'Plant'?",136options: [137"Portable lifting equipment only",138"Any structures, machinery, apparatus, or equipment",139"Power circuits only",140"Workshop equipment only"141],142answer: 1143},144 145{146question: "Who is the person in charge of the operation of the plant?",147options: [148"The Operating Manager",149"The Senior Shift Supervisor",150"The person delegated in writing to be in charge of the operation of the plant",151"Any Responsible Person"152],153answer: 2154},155 156{157question: "When is a Permit to Work deemed to be in force?",158options: [159"When the Responsible Person signs the application",160"When the Appointed Person issues the permit",161"When the Responsible Person signs acceptance",162"When work starts"163],164answer: 2165},166 167{168question: "When is a Permit to Work required?",169options: [170"When maintenance must be done",171"When work requiring an isolation must be done",172"Whenever work is to be done on plant",173"For any activity on the plant"174],175answer: 2176}177 178];179 180const quizContainer = document.getElementById("quiz");181let score = 0;182 183questions.forEach((q,index)=>{184 185    const div = document.createElement("div");186    div.classList.add("question");187 188    let html = `<h3>${index+1}. ${q.question}</h3>`;189 190    q.options.forEach((option,i)=>{191        html += `192        <button class="option"193        onclick="selectAnswer(this,${index},${i})">194        ${option}195        </button>`;196    });197 198    div.innerHTML = html;199    quizContainer.appendChild(div);200});201 202function selectAnswer(button,qIndex,selectedIndex){203 204    const questionDiv = button.parentElement;205    const buttons = questionDiv.querySelectorAll(".option");206 207    buttons.forEach(btn=>{208        btn.classList.add("disabled");209    });210 211    const correctAnswer = questions[qIndex].answer;212 213    if(selectedIndex === correctAnswer){214        button.classList.add("correct");215        score++;216    }else{217        button.classList.add("wrong");218        buttons[correctAnswer].classList.add("correct");219    }220}221 222let timeLeft = 15 * 60;223 224const timer = setInterval(()=>{225 226    let minutes = Math.floor(timeLeft/60);227    let seconds = timeLeft % 60;228 229    document.getElementById("timer").innerHTML =230        `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;231 232    if(timeLeft <= 0){233        clearInterval(timer);234        endQuiz();235    }236 237    timeLeft--;238 239},1000);240 241function endQuiz(){242 243    clearInterval(timer);244 245    document.querySelectorAll(".option").forEach(btn=>{246        btn.classList.add("disabled");247    });248 249    document.getElementById("submitBtn").disabled = true;250 251    document.getElementById("result").innerHTML =252        `Final Score: ${score} / ${questions.length}`;253}254 255</script>256 257</body>258</html>
