<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PSR Lesson 3</title>
<style>
  body{
    font-family:system-ui,Segoe UI,Roboto,Arial;
    margin:0;
    padding:0;
    background:#020617;
    color:#f9fafb;
  }
  .app{max-width:1000px;margin:0 auto;padding:24px 16px 40px;}
  .card{
    background:#0b1120;
    border-radius:12px;
    padding:20px 18px;
    box-shadow:0 18px 45px rgba(0,0,0,0.8);
    border:1px solid #1f2937;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:10px;
  }
  h1{margin:0;font-size:22px;color:#e5e7eb}
  .subtitle{font-size:13px;color:#9ca3af;margin-top:4px}

    text-align:right;
    font-size:13px;
    color:#d1d5db;
  }
  .timer{font-weight:600;color:#38bdf8;font-size:15px}
  .score{margin-top:4px}
  .btn{
    display:inline-block;
    padding:9px 13px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    font-size:14px;
    font-weight:500;
    margin-right:8px;
    margin-bottom:8px;
  }
  .btn-primary{background:#2563eb;color:#f9fafb}
  .btn-secondary{background:#111827;color:#e5e7eb;border:1px solid #374151}
  .btn:disabled{opacity:0.45;cursor:default}
  .question-block{
    margin-top:6px;
    padding-top:10px;
    border-top:1px solid #111827;
  }
  .q-text{font-weight:600;font-size:15px;color:#f9fafb;margin-bottom:8px}

    width:100%;

    border:1px solid #374151;
    background:#020617;

    font-size:13px;
  }

    outline:none;
    border-color:#38bdf8;

    margin-top:6px;
    padding:8px 10px;
    border-radius:8px;
    background:#111827;
    border:1px dashed #38bdf8;
    font-size:13px;
    color:#e0f2fe;
  }
  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
  }
  .progress{
    font-size:13px;
    color:#9ca3af;
  }
  .feedback{
    margin-top:6px;
    font-size:13px;
  }

  .feedback.bad{color:#fca5a5}

    border:1px solid #38bdf8;

<div class="app">

<script>
// -------- LESSON 3 NB QUESTIONS (2,3,4,7,8,9,11,12,13,17,18,20,21,24,25,27,28) --------
const questions = [
  {
    id: 2,
    prompt: "Define Key Safe.",

    prompt: "What is the primary purpose of the Operating Lock and the Safety Lock on the Key Safe?",

    ]

  {
    id: 8,
    prompt: "Define Safety Lock.",

      "Means a lock used for locking isolations.",

    keywords: [

  },
  {
    id: 9,
    prompt: "List the seven requirements of a Safety Lock or suite of Safety Locks and keys.",
    solutions: [
      "Be marked with an individual number.",

      "Form part of a series that is different from any other series in use at that site.",
      "The available key must be affixed to a key ring in such a manner as to prevent its removal without the use of tools.",
      "The dimensions of the ring must be such that destruction of the ring is necessary before it can be removed from a locked Key Safe.",

      "Except in the case of a suite of Safety Locks where a master key for a suite of Safety Locks is permissible."
    ],
    keywords: [
      ["marked","individual","number"],
      ["one","available","key","same","number"],
      ["series","different","site"],
      ["affixed","key","ring","removal","tools"],
      ["dimensions","ring","destruction","removed","locked","key","safe"],
      ["no","duplicate","master","keys"],
      ["suite","safety","locks","master","key","permissible"]
    ]
  },
  {

    prompt: "Describe the procedure to use the Key Safe under the following condition: Work to be done on plant (Permit A).",
    solutions: [
      "The keys of Safety Locks used on isolation points must be placed together on one Key Safe (No. 1).",
      "The Key Safe must be locked with an Operating Lock and a Safety Lock.",

    ],
    keywords: [
      ["keys","safety","locks","isolation","key","safe","no","1"],
      ["locked","operating","lock","safety","lock"],
      ["key","safety","lock","issued","permit","work","a"]
    ]
  },
  {
    id: 12,
    prompt: "Describe the procedure to use the Key Safe under the following condition: Work that includes all or part of the same isolations (Permit B).",
    solutions: [
      "Apply an additional Safety Lock to Key Safe No. 1.",

      ["additional","safety","lock","key","safe","no","1"],

    prompt: "Describe the procedure to use the Key Safe under the following condition: Work that includes all or part of the same isolations and requires additional isolations (Permit C).",
    solutions: [

      "Key Safe No. 2 is locked with an Operating Lock and a Safety Lock.",
      "The key to this Safety Lock is issued with Permit to Work C.",
      "Cross-reference Permits A, B and C."
    ],
    keywords: [
      ["additional","safety","lock","key","safe","no","1"],
      ["key","safe", "lock"],
      ["key","safety","lock","additional","isolation","key","safe","no","2"],
      ["key","safe","no","2","locked","operating","lock","safety","lock"],
      ["key","safety","lock","issued","permit","work","c"],
      ["cross-reference","permits","a","b","c"]
    ]
  },
  {
    id: 17,
    prompt: "Define Isolate / Isolation / Isolated.",
    solutions: [
      "Means to make safe to work on.",
      "By effectively disconnecting from all possible sources.",
      "Of dangerous energy",
      "and/or harmful substances."
    ],
    keywords: [
      ["make","safe","work","on"],
      ["disconnecting","all","possible","sources"],
      ["dangerous","energy"],
      ["harmful","substances"]
    ]
  },
  {
    id: 18,
    prompt: "List the three sources to be isolated before any work may be carried out.",
    solutions: [
      "Electrical potential.",
      "Dangerous / hazardous substances.",
      "Dangerous movement."
    ],
    keywords: [
      ["electrical","potential"],
      ["dangerous","hazardous","substances"],
      ["dangerous","movement"]
    ]
  },
  {
    id: 20,
    prompt: "Define Prohibitory Sign.",
    solutions: [
      "Means a sign in approved form.",
      "Attached to a point of isolation for the duration of a Permit to Work.",

  },
  {
    id: 21,
    prompt: "Where shall Prohibitory Signs be attached?",
    solutions: [
      "Prohibitory Signs must be affixed to all points of isolation.",
      "Where possible, to all remote-control stations of plant under a Permit to Work."
    ],
    keywords: [
      ["affixed","all","points","isolation"],
      ["remote-control","stations","plant","permit","work"]
    ]
  },
  {
    id: 24,
    prompt: "Define Warning Sign.",
    solutions: [
      "Means a sign in approved form.",
      "Calling attention to the danger of approach to.",
      "Or prohibiting interference with the plant or equipment to which it is attached."
    ],
    keywords: [
      ["sign","approved","form"],
      ["calling","attention","danger","approach"],
      ["prohibiting","interference","plant","equipment"]
    ]
  },
  {
    id: 25,
    prompt: "Describe the method to extend a full Key Safe.",
    solutions: [

      "The key to this Safety Lock must be placed on the extended Key Safe with the other isolation keys.",

    ],
    keywords: [
      ["safety","lock","instead","operating","lock"],
      ["key","safety","lock","extended","key","safe","isolation","keys"],
      ["extended","key","safe","locked","safety","lock","operating","lock"]
    ]
  },
  {
    id: 27,
    prompt: "Define Operating Activity.",
    solutions: [
      "Means the opening and closing of breakers/isolators and valves/dampers.",
      "For the control of plant and to effect isolations.",
      "And to control other activities involved in the operating process of electricity generation.",
      "Which are done in accordance with formulated safe procedures."
    ],
    keywords: [
      ["opening","closing","breakers","isolators","valves","dampers"],
      ["control","plant","effect","isolations"],
      ["operating","process","electricity","generation"],
      ["accordance","formulated","safe","procedures"]
    ]
  },
  {
    id: 28,
    prompt: "How is the security and integrity of a point of isolation ensured?",
    solutions: [
      "All points of isolation shall be immobilised by:",
      "The application of a Safety Lock at each point of isolation.",
      "A Prohibitory Sign attached at each point of isolation.",
      "In the case of remote-control stations, a further Prohibitory Sign must be attached."
    ],
    keywords: [
      ["points","isolation","immobilised"],
      ["safety","lock","each","point","isolation"],
      ["prohibitory","sign","each","point","isolation"],
      ["remote-control","stations","further","prohibitory","sign"]
    ]
  }
];



// -------- STATE --------
let currentQuestionIndex = -1;       // -1 = not started
let testStarted = false;
let testFinished = false;

const totalPossibleMarks = questions.reduce((sum,q)=>sum+q.solutions.length,0);
let score = 0;

// per-question state: {inputs:[], hintUsed:boolean, scored:boolean, questionMark:number}
const questionState = {};
questions.forEach(q=>{
  questionState[q.id] = {
    inputs: Array(q.solutions.length).fill(""),
    hintUsed: false,
    scored: false,
    questionMark: 0
  };
});

let timeLeft = 30 * 60; // 30 minutes in seconds
let timerInterval = null;

const appCard = document.getElementById("app-card");
// -------- Progress helper for home page --------
function updateLessonProgress(lessonId, percent){
  try{
    const key = "psr_lesson_progress";
    const raw = localStorage.getItem(key);
    const data = raw ? JSON.parse(raw) : {};
    const prev = typeof data[lessonId] === "number" ? data[lessonId] : 0;
    if(percent > prev){
      data[lessonId] = percent;
      localStorage.setItem(key, JSON.stringify(data));
    }
  }catch(e){
    // ignore storage errors
  }
}

// -------- HELPERS --------
function makeButton(label, cls, handler){
  const b = document.createElement("button");
  b.textContent = label;
  b.className = cls;
  b.onclick = handler;
  return b;
}
function normalizeText(t){
  return t.trim().toLowerCase().replace(/\s+/g," ");
}
// Levenshtein distance between two strings
function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(m === 0) return n;
  if(n === 0) return m;
  const dp = Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      dp[i][j] = Math.min(
        dp[i-1][j] + 1,      // delete
        dp[i][j-1] + 1,      // insert
        dp[i-1][j-1] + cost  // substitute
      );
    }
  }
  return dp[m][n];
}

// spelling tolerance: accept if distance <= 30% of max length
function similarEnough(a, b){
  a = a.toLowerCase();
  b = b.toLowerCase();
  const maxLen = Math.max(a.length, b.length);
  if(maxLen === 0) return true;
  const dist = levenshtein(a, b);
  return dist <= maxLen * 0.3;
}

function answerMatches(userText, solution, keywords){
  const uRaw = userText || "";
  const u = normalizeText(uRaw);
  if(!u) return false;           // empty input

  // Split user input into tokens for fuzzy matching
  const tokens = u.split(" ").filter(Boolean);

  // If keywords defined: ANY keyword matching is enough for a mark
  if(Array.isArray(keywords) && keywords.length){
    for(const kw of keywords){
      const kwNorm = kw.toLowerCase();
      // exact substring check first
      if(u.includes(kwNorm)) return true;
      // fuzzy word-by-word check with spelling tolerance
      for(const tok of tokens){
        if(similarEnough(tok, kwNorm)) return true;
      }
    }
  }

  // Fallback: check if user text is reasonably similar to the whole solution text
  const s = normalizeText(solution || "");
  if(s){
    // Compare on a token basis: if at least one solution word is similar, accept
    const solTokens = s.split(" ").filter(Boolean);
    for(const st of solTokens){
      for(const tok of tokens){
        if(similarEnough(tok, st)) return true;
      }
    }
  }

  return false;
}

function formatTime(sec){
  const m = String(Math.floor(sec/60)).padStart(2,"0");
  const s = String(sec%60).padStart(2,"0");
  return `${m}:${s}`;
}
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  updateTimerDisplay();
  timerInterval = setInterval(()=>{
    timeLeft--;
    if(timeLeft <= 0){
      timeLeft = 0;
      updateTimerDisplay();
      finishTest("Time is up.");
      clearInterval(timerInterval);
    } else {
      updateTimerDisplay();
    }
  },1000);
}
function updateTimerDisplay(){
  const t = document.getElementById("timer-span");
  if(t) t.textContent = formatTime(timeLeft);
}
function launchConfetti(){
  const colors = ["#f97316","#22c55e","#38bdf8","#eab308","#ec4899","#a855f7"];
  for(let i=0;i<150;i++){
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    const color = colors[Math.floor(Math.random()*colors.length)];
    const xOffset = (Math.random()*200-100) + "vw";
    const left = (Math.random()*100) + "vw";
    piece.style.setProperty("--c", color);
    piece.style.setProperty("--x", xOffset);
    piece.style.left = left;
    piece.style.animationDelay = (Math.random()*0.7) + "s";
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(), 3000);
  }
}

// -------- RENDER --------
function render(){
  appCard.innerHTML = "";
  const header = document.createElement("header");
  const left = document.createElement("div");
  const h = document.createElement("h1");
  h.textContent = "PSR Lesson 3";
  left.appendChild(h);
  const sub = document.createElement("div");
  sub.className = "subtitle";
  sub.textContent = "Each correct solution = 1 mark. Total = " + totalPossibleMarks + " marks. If Hint is used, that question can score max 1 mark.";
  left.appendChild(sub);
  header.appendChild(left);

  const right = document.createElement("div");
  right.className = "top-right";
  const tLabel = document.createElement("div");
  tLabel.innerHTML = `Time left: <span id="timer-span" class="timer">${formatTime(timeLeft)}</span>`;
  right.appendChild(tLabel);
  const sLabel = document.createElement("div");
  sLabel.className = "score";
  sLabel.textContent = `Score: ${score} / ${totalPossibleMarks}`;
  right.appendChild(sLabel);
  header.appendChild(right);
  appCard.appendChild(header);

  if(!testStarted){
    const intro = document.createElement("div");
    intro.className = "subtitle";
    intro.textContent = "Press Start Test to begin. You will see one NB question at a time.";
    appCard.appendChild(intro);
    const btn = makeButton("Start Test","btn btn-primary",()=>{
      testStarted = true;
      currentQuestionIndex = 0;
      startTimer();
      render();
    });
    appCard.appendChild(btn);
    return;
  }

  if(testFinished){
    renderResultSection();
    return;
  }

  const q = questions[currentQuestionIndex];
  const qs = questionState[q.id];

  const qBlock = document.createElement("div");
  qBlock.className = "question-block";

  const qText = document.createElement("div");
  qText.className = "q-text";
  qText.textContent = `Q${q.id}. ${q.prompt}`;
  qBlock.appendChild(qText);

  const inputsDiv = document.createElement("div");
  inputsDiv.className = "input-row";
  q.solutions.forEach((_, idx)=>{
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Answer " + (idx+1);
    input.value = qs.inputs[idx] || "";
    input.oninput = e => {
      qs.inputs[idx] = e.target.value;
    };
    inputsDiv.appendChild(input);
  });
  qBlock.appendChild(inputsDiv);

  if(qs.hintUsed){
    const hintBox = document.createElement("div");
    hintBox.className = "hint-box";
    hintBox.innerHTML = "<strong>Official solutions:</strong><br>" +
      q.solutions.map((s,i)=>`Answer ${i+1}: ${s}`).join("<br>");
    qBlock.appendChild(hintBox);
  }

  const nav = document.createElement("div");
  nav.className = "nav-row";

  const leftNav = document.createElement("div");
  const hintBtn = makeButton("Hint","btn btn-secondary",()=>{
    qs.hintUsed = true;
    render();
  });
  leftNav.appendChild(hintBtn);

  const submitBtn = makeButton("Submit","btn btn-primary",()=>{
    markCurrentQuestion();
  });
  leftNav.appendChild(submitBtn);
  nav.appendChild(leftNav);

  const rightNav = document.createElement("div");
  const progress = document.createElement("span");
  progress.className = "progress";
  progress.textContent = `Question ${currentQuestionIndex+1} of ${questions.length}`;
  rightNav.appendChild(progress);
  nav.appendChild(rightNav);

  qBlock.appendChild(nav);

  if(qs.scored){
    const fb = document.createElement("div");
    fb.className = "feedback " + (qs.questionMark>0?"good":"bad");
    fb.textContent = `Marked: ${qs.questionMark} mark(s) for this question (out of ${q.solutions.length}).` +
      (qs.hintUsed ? " (Hint used – max 1 mark possible)" : "");
    qBlock.appendChild(fb);

    const nav2 = document.createElement("div");
    nav2.className = "nav-row";
    const spacer = document.createElement("div");
    nav2.appendChild(spacer);
    const nextBtn = makeButton(
      currentQuestionIndex === questions.length-1 ? "Finish" : "Next",
      "btn btn-secondary",
      ()=>{
        if(currentQuestionIndex === questions.length-1){
          finishTest();
        } else {
          currentQuestionIndex++;
          render();
        }
      }
    );
    nav2.appendChild(nextBtn);
    qBlock.appendChild(nav2);
  }

  appCard.appendChild(qBlock);
}

function markCurrentQuestion(){
  const q = questions[currentQuestionIndex];
  const qs = questionState[q.id];

  // remove previous marks for this question from score
  score -= qs.questionMark;

  // We allow any solution in any input, but each input can only be used once
  const rawInputs = qs.inputs.slice();          // array of strings
  const usedInputs = Array(rawInputs.length).fill(false);
  let correctCount = 0;

  q.solutions.forEach((sol, sIdx)=>{
    const kw = (q.keywords && q.keywords[sIdx]) ? q.keywords[sIdx] : [];
    let matched = false;
    for(let i=0;i<rawInputs.length && !matched;i++){
      if(usedInputs[i]) continue;
      if(answerMatches(rawInputs[i], sol, kw)){
        matched = true;
        usedInputs[i] = true;
        correctCount++;
      }
    }
  });

  let newMark;
  if(qs.hintUsed){
    // If at least one correct with Hint, give 1 mark max for that question
    newMark = correctCount > 0 ? 1 : 0;
  } else {
    newMark = correctCount;
  }

  qs.questionMark = newMark;
  qs.scored = true;
  score += newMark;

  render();
}


function finishTest(reason){
  if(testFinished) return
  testFinished = true;
  if(timerInterval) clearInterval(timerInterval);
  renderResultSection(reason);
}

function renderResultSection(reason){
  appCard.innerHTML = "";

  const h = document.createElement("h1");
  h.textContent = "Test Completed";
  appCard.appendChild(h);

  if(reason){
    const r = document.createElement("div");
    r.className = "subtitle";
    r.textContent = reason;
    appCard.appendChild(r);
  }

  const resultDiv = document.createElement("div");
  resultDiv.className = "result";

  const passed = score === totalPossibleMarks;
  const percent = (score / totalPossibleMarks) * 100;

    // store best score for this test (choose any stable ID string)
  updateLessonProgress("lesson4", percent);

  const statusTag = `<span class="status-tag ${passed?"status-pass":"status-fail"}">${passed?"PASS (100%)":"FAIL"}</span>`;
  resultDiv.innerHTML =
    `Final score: ${score} / ${totalPossibleMarks} (${percent.toFixed(1)}%) ${statusTag}`;

  appCard.appendChild(resultDiv);

  const summaryTitle = document.createElement("div");
  summaryTitle.style.marginTop = "8px";
  summaryTitle.textContent = "Question breakdown:";
  appCard.appendChild(summaryTitle);

  questions.forEach((q, idx)=>{
    const qs = questionState[q.id];
    const item = document.createElement("div");
    item.className = "summary-item";
    const maxForQ = q.solutions.length;
    item.textContent =
      `Q${q.id} (${idx+1}/${questions.length}): ${qs.questionMark} / ${maxForQ}` +
      (qs.hintUsed ? " (Hint used)" : "");
    appCard.appendChild(item);
  });

  if(passed){
    launchConfetti();
  }

  const restartDiv = document.createElement("div");
  restartDiv.style.marginTop = "12px";
  restartDiv.appendChild(
    makeButton("Restart Test","btn btn-secondary",()=>{
      // reset state
      score = 0;
      timeLeft = 30 * 60;
      Object.keys(questionState).forEach(id=>{
        const st = questionState[id];
        st.inputs = st.inputs.map(()=> "");
        st.hintUsed = false;
        st.scored = false;
        st.questionMark = 0;
      });
      currentQuestionIndex = -1;
      testStarted = false;
      testFinished = false;
      startTimer();
      render();
    })
  );
  appCard.appendChild(restartDiv);
}

// initial render
render();
</script>
</body>
</html>
