<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSR Tests – Progress Tracker 18:45</title>
<style>
  body{
    font-family:system-ui,Segoe UI,Roboto,Arial;
    margin:0;
    padding:0;
    background:#020617;
    color:#f9fafb;
  }
  .app{
    max-width:1100px;
    margin:0 auto;
    padding:24px 16px 40px;
  }
  .card{
    background:#0b1120;
    border-radius:12px;
    padding:20px 18px;
    box-shadow:0 18px 45px rgba(0,0,0,0.75);
    border:1px solid #1f2937;
  }
  h1{
    margin:0 0 6px;
    font-size:22px;
    color:#e5e7eb;
  }
  .subtitle{
    font-size:13px;
    color:#9ca3af;
    margin-bottom:16px;
  }
  .lesson-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
  }
  .lesson-info{
    flex:1;
  }
  .lesson-title{
    font-size:15px;
    font-weight:600;
    margin-bottom:4px;
  }
  .lesson-link{
    font-size:13px;
    color:#60a5fa;
    text-decoration:none;
  }
  .lesson-link:hover{text-decoration:underline;}
  .progress-wrap{
    flex:2;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .progress-bar{
    position:relative;
    flex:1;
    height:14px;
    border-radius:999px;
    background:#111827;
    overflow:hidden;
    border:1px solid #1f2937;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#22c55e,#4ade80);
    transition:width 0.25s ease-out;
  }
  .progress-text{
    font-size:12px;
    color:#d1d5db;
    min-width:52px;
    text-align:right;
  }
  .star{
    width:20px;
    text-align:center;
    font-size:18px;
    line-height:1;
    color:#facc15;
    visibility:hidden;
  }
  .star.visible{
    visibility:visible;
  }
  .reset-btn{
    margin-top:12px;
    font-size:12px;
    opacity:0.7;
  }
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <h1>PSR Tests – Progress Tracker</h1>
    <div class="subtitle">
      Each test shows your best score so far. A star appears when you achieve 100%.
    </div>

    <div id="lessons-container"></div>

    <button class="btn reset-btn btn-secondary" id="reset-btn">
      Reset all progress
    </button>
  </div>
</div>

<script>
// Must match the lesson IDs you pass to updateLessonProgress(..)
const lessons = [
  { id: "lesson1", title: "Key Learning Points", file: "test1.html" },
  { id: "lesson2", title: "Lesson 1", file: "test2.html" },
  { id: "lesson3", title: "Lesson 2", file: "test3.html" },
  { id: "lesson4", title: "Lesson 3", file: "test4.html" },
  { id: "lesson5", title: "Lesson 4", file: "test5.html" },
  { id: "lesson6", title: "Lesson 5", file: "test6.html" },
  { id: "lesson7", title: "Lesson 6", file: "test7.html" },
  { id: "lesson8", title: "Lesson 7", file: "test8.html" },
  { id: "lesson9", title: "Lesson 8", file: "test9.html" },
  { id: "lesson10", title: "Lesson 9", file: "test10.html" }
];

function loadProgress(){
  try{
    const raw = localStorage.getItem("psr_lesson_progress");
    return raw ? JSON.parse(raw) : {};
  }catch(e){
    return {};
  }
}

function saveProgress(data){
  try{
    localStorage.setItem("psr_lesson_progress", JSON.stringify(data));
  }catch(e){}
}

function renderLessons(){
  const container = document.getElementById("lessons-container");
  const data = loadProgress();
  container.innerHTML = "";

  lessons.forEach(lesson=>{
    const row = document.createElement("div");
    row.className = "lesson-row";

    const info = document.createElement("div");
    info.className = "lesson-info";
    const title = document.createElement("div");
    title.className = "lesson-title";
    title.textContent = lesson.title;
    info.appendChild(title);

    if(lesson.file){
      const link = document.createElement("a");
      link.className = "lesson-link";
      link.href = lesson.file;
      link.textContent = "Open test";
      info.appendChild(link);
    }

    const progressWrap = document.createElement("div");
    progressWrap.className = "progress-wrap";

    const star = document.createElement("div");
    star.className = "star";
    star.textContent = "★";

    const bar = document.createElement("div");
    bar.className = "progress-bar";
    const fill = document.createElement("div");
    fill.className = "progress-fill";
    bar.appendChild(fill);

    const text = document.createElement("div");
    text.className = "progress-text";

    const value = typeof data[lesson.id] === "number" ? data[lesson.id] : 0;
    fill.style.width = value + "%";
    text.textContent = value.toFixed(0) + "%";
    if(value >= 100){
      star.classList.add("visible");
    }

    progressWrap.appendChild(star);
    progressWrap.appendChild(bar);
    progressWrap.appendChild(text);

    row.appendChild(info);
    row.appendChild(progressWrap);
    container.appendChild(row);
  });
}

document.getElementById("reset-btn").addEventListener("click", ()=>{
  if(confirm("Reset all stored test progress?")){
    saveProgress({});
    renderLessons();
  }
});

renderLessons();
</script>
</body>
</html>
